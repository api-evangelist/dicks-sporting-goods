name: Dick's Sporting Goods
description: 'DICK''S Sporting Goods is a Fortune 500 omni-channel sporting goods retailer selling sports
  equipment, apparel, footwear and accessories across the DICK''S, House of Sport, Golf Galaxy, Public
  Lands and Going Going Gone banners. It publishes no developer portal, no API reference and no machine-readable
  contract: the storefront is an Angular single-page app that answers HTTP 200 with the same shell for
  every path, and neither api. nor developer.dickssportinggoods.com resolves in DNS. Its B2B integration
  surface is X12 EDI over AS2/SFTP through third-party trading networks, with vendor guidelines handed
  out as PDFs. The company does run a named Vulnerability Disclosure Program on Bugcrowd.'
